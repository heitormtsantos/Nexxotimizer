<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nexxsensi - Splashscreen</title>
  <style>
    :root {
      --bg: #03060d;
      --panel: rgba(7, 15, 29, 0.72);
      --line: rgba(41, 185, 255, 0.26);
      --blue: #22bdff;
      --blue-2: #006eff;
      --cyan: #00f0ff;
      --green: #00f7a1;
      --text: #f5fbff;
      --muted: #90a7be;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 25%, rgba(34, 189, 255, 0.26), transparent 28%),
        radial-gradient(circle at 20% 80%, rgba(0, 247, 161, 0.12), transparent 24%),
        linear-gradient(145deg, #010208, #071120 48%, #02050c);
      color: var(--text);
      font-family: "Segoe UI", "Bahnschrift", sans-serif;
      overflow: hidden;
    }

    .phone {
      width: min(430px, 94vw);
      aspect-ratio: 9 / 19.5;
      position: relative;
      overflow: hidden;
      border-radius: 42px;
      border: 9px solid #121820;
      background: #02050b;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.72), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .phone::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, transparent 0 33%, rgba(34, 189, 255, 0.13) 34%, transparent 36%),
        linear-gradient(290deg, transparent 0 46%, rgba(0, 240, 255, 0.1) 47%, transparent 49%),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.025), rgba(255,255,255,0.025) 1px, transparent 1px, transparent 5px);
      opacity: 0.85;
    }

    .phone::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      left: 50%;
      top: 34%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(34, 189, 255, 0.28), rgba(0, 110, 255, 0.1) 38%, transparent 68%);
      filter: blur(2px);
      animation: aura 2.7s ease-in-out infinite;
    }

    .content {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 72px 30px 36px;
    }

    .brand {
      align-self: center;
      display: grid;
      justify-items: center;
      text-align: center;
      transform: translateY(-12px);
    }

    .logo-shell {
      width: 238px;
      height: 238px;
      display: grid;
      place-items: center;
      position: relative;
      border-radius: 50%;
    }

    .logo-shell::before,
    .logo-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      border: 1px solid rgba(34, 189, 255, 0.28);
    }

    .logo-shell::before {
      animation: pulse 1.9s ease-out infinite;
    }

    .logo-shell::after {
      inset: 22px;
      border-color: rgba(0, 247, 161, 0.16);
      animation: spin 5.5s linear infinite;
      border-top-color: var(--blue);
      border-right-color: transparent;
    }

    .logo {
      width: 198px;
      max-height: 198px;
      object-fit: contain;
      filter: drop-shadow(0 0 28px rgba(34, 189, 255, 0.72));
      animation: logoIn 0.9s cubic-bezier(.2,.9,.2,1) both;
    }

    .tag {
      margin-top: 20px;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(5, 13, 25, 0.72);
      color: var(--cyan);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 0 26px rgba(34, 189, 255, 0.18);
    }

    h1 {
      margin: 14px 0 0;
      font-size: 26px;
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      max-width: 270px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .bottom {
      display: grid;
      gap: 16px;
    }

    .loader-card {
      padding: 16px;
      border: 1px solid rgba(34, 189, 255, 0.2);
      border-radius: 22px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: 0 0 34px rgba(0, 110, 255, 0.16);
    }

    .loader-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--text);
      font-size: 12px;
      font-weight: 850;
    }

    .loader-head span:last-child {
      color: var(--green);
    }

    .bar {
      height: 9px;
      margin-top: 13px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
    }

    .bar i {
      display: block;
      width: 72%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue-2), var(--blue), var(--green));
      box-shadow: 0 0 22px rgba(0, 247, 161, 0.42);
      animation: load 2.4s ease-in-out infinite;
    }

    .checks {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .check {
      min-height: 52px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      background: rgba(7, 15, 29, 0.62);
      color: #c8d8e8;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.2;
    }

    .home-indicator {
      width: 128px;
      height: 4px;
      margin: 2px auto 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.84);
    }

    @keyframes pulse {
      from {
        opacity: 0.95;
        transform: scale(0.84);
      }
      to {
        opacity: 0;
        transform: scale(1.16);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes logoIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.88);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes load {
      0% {
        width: 16%;
      }
      45% {
        width: 64%;
      }
      100% {
        width: 92%;
      }
    }

    @keyframes aura {
      0%, 100% {
        opacity: 0.72;
        transform: translate(-50%, -50%) scale(0.96);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.08);
      }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="Preview da splashscreen Nexxsensi">
    <section class="content">
      <div class="brand">
        <div class="logo-shell">
          <img class="logo" src="assets/splash-logo.png" alt="Nexxsensi" />
        </div>
        <div class="tag">Game Booster Android</div>
        <h1>Nexxsensi</h1>
        <p>Preparando o modo avançado, leitura do dispositivo e painel gamer.</p>
      </div>

      <div class="bottom">
        <div class="loader-card">
          <div class="loader-head">
            <span>Inicializando otimizações</span>
            <span>72%</span>
          </div>
          <div class="bar"><i></i></div>
        </div>

        <div class="checks">
          <div class="check">Perfil<br />gamer</div>
          <div class="check">Dados<br />reais</div>
          <div class="check">Overlay<br />pronto</div>
        </div>

        <div class="home-indicator"></div>
      </div>
    </section>
  </main>
</body>
</html>
